# Release pipeline.
#
# Push a tag `vX.Y.Z` to build, sign, notarize, publish the DMG to the public
# nateships/sleepbar release, and push the Sparkle appcast + changelog to the
# website repo (Cloudflare Pages deploys from its main branch).
#
# Run manually with "publish: false" to exercise build + notarization only.
# The notarized DMG is uploaded as a workflow artifact either way.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Must have a CHANGELOG.md section."
        required: true
      publish:
        description: "Publish the GitHub release and update the website"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASES_REPO: nateships/sleepbar

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PUBLISH=$PUBLISH" >> "$GITHUB_ENV"
          echo "Building $VERSION (publish=$PUBLISH)"
          if gh release view "v$VERSION" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists in $RELEASES_REPO" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.SLEEPBAR_SITE_TOKEN }}

      - name: Check release notes exist
        run: mise run release-notes > build/notes.md
        env:
          MISE_TASK_OUTPUT: quiet

      - name: Import signing certificate and provisioning profile
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's Developer ID intermediate CA. Needed to build the trust chain.
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign

          echo -n "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -k "$KEYCHAIN" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILE="$RUNNER_TEMP/developer-id.provisionprofile"
          echo -n "$DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          PLIST="$(security cms -D -i "$PROFILE")"
          UUID="$(plutil -extract UUID raw -o - - <<< "$PLIST")"
          NAME="$(plutil -extract Name raw -o - - <<< "$PLIST")"
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"

      - name: Archive and export
        run: mise run archive

      - name: Build DMG
        run: mise run dmg

      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: mise run notarize

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepBar-${{ env.VERSION }}
          path: build/SleepBar.dmg
          if-no-files-found: error

      - name: Check out website repo
        if: env.PUBLISH == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.SLEEPBAR_SITE_TOKEN }}
          path: site

      - name: Update appcast
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run appcast site

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.SLEEPBAR_SITE_TOKEN }}
        run: |
          cp build/SleepBar.dmg "build/SleepBar-$VERSION.dmg"
          gh release create "v$VERSION" \
            --repo "$RELEASES_REPO" \
            --title "SleepBar $VERSION" \
            --notes-file build/notes.md \
            "build/SleepBar-$VERSION.dmg" \
            build/SleepBar.dmg

      - name: Push appcast and changelog to website
        if: env.PUBLISH == 'true'
        run: |
          cp CHANGELOG.md site/CHANGELOG.md
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml CHANGELOG.md
          git commit -m "Release SleepBar $VERSION"
          git push

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
