# SleepBar release pipeline.
#
# Trigger with a tag `vX.Y.Z`, or manually with a version. The manual run
# defaults to a dry run: build, sign, notarize, upload the DMG as a workflow
# artifact, publish nothing. A manual run builds the ref it is dispatched on.
#
# Publishing creates the GitHub release with the DMG and appcast.xml as
# assets (sleepbar.app/appcast.xml redirects to the latest release's copy),
# and bumps the Homebrew cask in nateships/homebrew-tap.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Must have a CHANGELOG.md section."
        required: true
      publish:
        description: "Publish the GitHub release, update the website and the Homebrew cask"
        type: boolean
        default: false
      tap_only:
        description: "Skip the build. Only bump the Homebrew cask to an already published version."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !inputs.tap_only }}
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish }}"
          fi
          {
            echo "VERSION=$VERSION"
            echo "PUBLISH=$PUBLISH"
          } >> "$GITHUB_ENV"
          {
            echo "version=$VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION from $(git rev-parse --short HEAD) (publish=$PUBLISH)"
          if [ "$PUBLISH" = "true" ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Check release notes exist
        run: |
          mkdir -p build
          mise run release-notes > build/notes.md
          printf '\n---\nBuilt from %s\n' "$GITHUB_SHA" >> build/notes.md
        env:
          MISE_TASK_OUTPUT: quiet

      - name: Import signing certificate and provisioning profile
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's Developer ID intermediate CA. Needed to build the trust chain.
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign

          echo -n "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -k "$KEYCHAIN" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILE="$RUNNER_TEMP/developer-id.provisionprofile"
          echo -n "$DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          PLIST="$(security cms -D -i "$PROFILE")"
          UUID="$(plutil -extract UUID raw -o - - <<< "$PLIST")"
          NAME="$(plutil -extract Name raw -o - - <<< "$PLIST")"
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"

      - name: Archive and export
        run: mise run archive

      - name: Notarize and staple app
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: mise run notarize app

      - name: Build DMG
        run: mise run dmg

      - name: Notarize and staple DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: mise run notarize dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SleepBar-${{ env.VERSION }}
          path: build/SleepBar.dmg
          if-no-files-found: error

      - name: Update appcast
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run appcast

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/SleepBar.dmg "build/SleepBar-$VERSION.dmg"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SleepBar $VERSION" \
            --notes-file build/notes.md \
            "build/SleepBar-$VERSION.dmg" \
            build/SleepBar.dmg \
            build/appcast/appcast.xml

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

  # Runs after the release is public, so the cask URL resolves when the tap
  # updates. brew bump-cask-pr downloads the new DMG and rewrites version and
  # sha256 in Casks/sleepbar.rb in nateships/homebrew-tap.
  tap:
    needs: release
    if: ${{ !cancelled() && (inputs.tap_only || needs.release.outputs.publish == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Pick the version from the release job or the input
        env:
          RELEASED_VERSION: ${{ needs.release.outputs.version }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASED_VERSION:-$INPUT_VERSION}"
          [ -n "$VERSION" ] || { echo "No version" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # main

      - name: Bump the cask in the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          set -euo pipefail
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; the cask is not updated." >&2
            exit 1
          fi
          # Homebrew loads casks only from taps the user trusts.
          brew trust --tap nateships/tap
          brew tap nateships/tap
          tap="$(brew --repository nateships/tap)"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # bump-cask-pr fails when the cask already has this version. A rerun
          # after a successful bump must be a no-op.
          current="$(brew info --cask --json=v2 nateships/tap/sleepbar | jq -r '.casks[0].version')"
          if [ "$current" = "$VERSION" ]; then
            echo "Cask already at $VERSION; nothing to do."
            exit 0
          fi
          brew bump-cask-pr nateships/tap/sleepbar --version "$VERSION" --write-only --commit --no-audit --no-browse
          git -C "$tap" push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/nateships/homebrew-tap.git" HEAD:main
