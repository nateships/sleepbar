# SleepBar release pipeline.
#
# Runs here, in the public repo, so that macOS runners are free. The app source
# is checked out from nateships/sleepbar-private with PRIVATE_REPO_TOKEN.
#
# Trigger with a tag `vX.Y.Z` on this repo, or manually with a version.
# The manual run defaults to a dry run: build, sign, notarize, upload the DMG
# as a workflow artifact, publish nothing.
#
# Logs are public. Secrets are masked by GitHub. Source file names appear in
# build output.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (X.Y.Z). Must have a CHANGELOG.md section in sleepbar-private."
        required: true
      source_ref:
        description: "Branch, tag, or SHA of sleepbar-private to build"
        default: main
      publish:
        description: "Publish the GitHub release and update the website"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    working-directory: src

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out website repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: site

      - name: Check out app source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: nateships/sleepbar-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.source_ref || 'main' }}
          path: src
          persist-credentials: false

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          working_directory: src
          cache: true

      - name: Resolve version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VERSION="${{ inputs.version }}"
            PUBLISH="${{ inputs.publish }}"
          fi
          {
            echo "VERSION=$VERSION"
            echo "PUBLISH=$PUBLISH"
            echo "SOURCE_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          echo "Building $VERSION from sleepbar-private@$(git rev-parse --short HEAD) (publish=$PUBLISH)"
          if [ "$PUBLISH" = "true" ] && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists" >&2
            exit 1
          fi

      - name: Check release notes exist
        run: |
          mkdir -p build
          mise run release-notes > build/notes.md
          printf '\n---\nBuilt from sleepbar-private@%s\n' "$SOURCE_SHA" >> build/notes.md
        env:
          MISE_TASK_OUTPUT: quiet

      - name: Import signing certificate and provisioning profile
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Apple's Developer ID intermediate CA. Needed to build the trust chain.
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign

          echo -n "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -k "$KEYCHAIN" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

          PROFILE="$RUNNER_TEMP/developer-id.provisionprofile"
          echo -n "$DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          PLIST="$(security cms -D -i "$PROFILE")"
          UUID="$(plutil -extract UUID raw -o - - <<< "$PLIST")"
          NAME="$(plutil -extract Name raw -o - - <<< "$PLIST")"
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "PROVISIONING_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"

      - name: Archive and export
        run: mise run archive

      - name: Build DMG
        run: mise run dmg

      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: mise run notarize

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SleepBar-${{ env.VERSION }}
          path: src/build/SleepBar.dmg
          if-no-files-found: error

      - name: Update appcast
        if: env.PUBLISH == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run appcast "$GITHUB_WORKSPACE/site"

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/SleepBar.dmg "build/SleepBar-$VERSION.dmg"
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SleepBar $VERSION" \
            --notes-file build/notes.md \
            "build/SleepBar-$VERSION.dmg" \
            build/SleepBar.dmg

      - name: Push appcast and changelog to website
        if: env.PUBLISH == 'true'
        working-directory: site
        run: |
          cp ../src/CHANGELOG.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml CHANGELOG.md
          git commit -m "Release SleepBar $VERSION"
          git push origin HEAD:main

      - name: Clean up keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
