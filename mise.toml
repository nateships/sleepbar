[tools]
gh = "2.100.0"
xcbeautify = "3.2.1"
actionlint = "1.7.12"

[env]
DERIVED_DATA_PATH = "{{config_root}}/build/DerivedData"

[tasks.build]
description = "Debug build without code signing"
run = "scripts/build.sh"

[tasks.test]
description = "Run unit tests (Xcode must be signed in to the team)"
run = "scripts/test.sh"

[tasks.archive]
description = "Archive and export a Developer ID signed app. Needs VERSION, PROVISIONING_PROFILE_NAME"
run = "scripts/archive.sh"

[tasks.dmg]
description = "Build and sign build/SleepBar.dmg from the exported app"
run = "scripts/dmg.sh"

[tasks.notarize]
description = "Notarize and staple build/SleepBar.dmg"
run = "scripts/notarize.sh"

[tasks.appcast]
description = "Update the Sparkle appcast. Usage: mise run appcast <site-dir>. Needs VERSION"
run = "scripts/appcast.sh"

[tasks.release-notes]
description = "Print the CHANGELOG section for VERSION"
run = "scripts/release-notes.sh"

[tasks.lint]
description = "Lint GitHub Actions workflows"
run = "actionlint"
