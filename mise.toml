[tools]
gh = "2.101.0"
xcbeautify = "3.2.1"
actionlint = "1.7.12"

[env]
DERIVED_DATA_PATH = "{{config_root}}/build/DerivedData"

[tasks.build]
description = "Debug build without code signing"
run = "scripts/build.sh"

[tasks.dev]
description = "Signed Debug build, then run the app in the foreground. Ctrl-C quits"
run = "scripts/dev.sh"

[tasks.test]
description = "Run unit tests (Xcode must be signed in to the team)"
run = "scripts/test.sh"

[tasks.lint]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.release]
description = "Publish a release by hand, without release-please. Needs a CHANGELOG.md section. Usage: mise run release 1.1.1"
usage = '''
arg "<version>" help="Version to release, for example 1.1.1"
'''
run = 'gh workflow run release.yml -R nateships/sleepbar --ref main -f version="$usage_version" -f publish=true'

[tasks.release-dry-run]
description = "Build, sign, notarize without publishing. Usage: mise run release-dry-run 1.1.1 [ref]"
usage = '''
arg "<version>" help="Version to build, for example 1.1.1"
arg "[ref]" help="Git ref to build" default="main"
'''
run = 'gh workflow run release.yml -R nateships/sleepbar --ref "$usage_ref" -f version="$usage_version" -f publish=false'

[tasks.archive]
description = "Archive and export a Developer ID signed app. Needs VERSION, PROVISIONING_PROFILE_NAME"
run = "scripts/archive.sh"

[tasks.dmg]
description = "Build and sign build/SleepBar.dmg from the exported app"
run = "scripts/dmg.sh"

[tasks.notarize]
description = "Notarize and staple the exported app or the DMG. Usage: mise run notarize app|dmg"
usage = '''
arg "<target>" help="What to notarize" {
  choices "app" "dmg"
}
'''
run = 'scripts/notarize.sh "$usage_target"'

[tasks.appcast]
description = "Sign the DMG and write build/appcast/appcast.xml. Needs VERSION"
run = "scripts/appcast.sh"

[tasks.release-notes]
description = "Print the CHANGELOG section for VERSION"
run = "scripts/release-notes.sh"
